<section>
	<h1>O litoral</h1>
	<p>Diante do oceano, a memória encontra novos caminhos.</p>
	<p>As ondas chegam à areia e o viajante observa os barcos voltando ao porto.</p>
</section>
<section>
	<h2>O vento</h2>
	<p>O vento sopra do oceano e leva histórias para longe.</p>
	<p>A viagem termina com o caderno aberto e muitas páginas por escrever.</p>
</section>
