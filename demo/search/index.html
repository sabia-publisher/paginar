<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Busca — Paginar</title>
	<style>
		html, body { margin: 0; height: 100%; }
		#app { height: 100%; }
		paginate-content { display: block; height: 100%; }
		[slot="content"] p { margin: 1em 0; }
		[slot="content"] section + section { break-before: column; }
	</style>
</head>
<body>
	<div id="app">
		<paginate-content book-title="Demo de busca" reader-settings='{"search":true,"fontSize":19}'>
			<div slot="content" id="demo-text"></div>
		</paginate-content>
	</div>
	<script>
		const content = document.querySelector('#demo-text')
		for (let index = 1; index <= 12; index++) {
			const section = document.createElement('section')
			section.innerHTML = `<h2>Trecho ${index}</h2>
				<p>A leitura aproxima pessoas. Uma ação começa com atenção e imaginação.</p>
				<p>Experimente buscar “acao”, “LEITURA”, “lietura” ou “sao paulo”.</p>
				<p>A cidade de <strong>São</strong> <em>Paulo</em> aparece entre elementos diferentes.</p>
				<p>O coração da história guarda memórias, experiências e descobertas.</p>
				<p>Use Enter e Shift+Enter para percorrer os resultados. Esc fecha a busca.</p>`
			if (index === 7) section.innerHTML += '<p>Jabuticabeira: uma ocorrência distante para testar a navegação.</p>'
			content.append(section)
		}
	</script>
	<script type="module" src="../../dist/index.es.js"></script>
</body>
</html>
