<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="UTF-8">
<title>Busca: testes no navegador</title>
<style>
	body { margin: 0; font: 14px system-ui; }
	iframe { width: 100%; height: 680px; border: 0; }
	pre { margin: 0; padding: 1rem; white-space: pre-wrap; }
</style>
<iframe src="/demo/search/index.html?view=panel" title="Leitor em teste"></iframe>
<pre id="results">Executando…</pre>
<script type="module">
	const output = document.querySelector('#results')
	const frame = document.querySelector('iframe')
	const checks = []
	const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
	const assert = (condition, message) => {
		if (!condition) throw new Error(message)
		checks.push(`PASS ${message}`)
		output.textContent = checks.join('\n')
	}
	try {
		for (let attempt = 0; attempt < 100 && !frame.contentDocument?.querySelector('paginate-content')?.search; attempt++)
			await wait(50)
		const reader = frame.contentDocument.querySelector('paginate-content')
		const shadow = reader.shadowRoot
		const events = []
		const selections = []
		reader.addEventListener('paginar:search', event => events.push(event.detail))
		reader.addEventListener('paginar:search-select', event => selections.push(event.detail))
		await wait(250)
		const pages = reader.getState().pagination.totalPages
		reader.search('sao paulo', { view: 'panel', resultIndex: 8 })
		await wait(50)
		let state = reader.getSearchState()
		assert(state.results.length === 24, 'expressão entre elementos DOM com contexto')
		assert(state.activeIndex === 8 && reader.getState().pagination.currentPage === state.results[8].page, 'API seleciona ocorrência distante e navega')
		assert(reader.getState().pagination.totalPages === pages, 'painel preserva paginação')
		assert(shadow.querySelectorAll('.search-result').length === 24, 'painel lista todas as ocorrências')
		assert(shadow.activeElement === shadow.querySelector('#search-input'), 'abrir pela API mantém foco inicial no campo')
		shadow.querySelectorAll('.search-result')[12].click()
		await wait(20)
		assert(selections.at(-1).index === 12 && selections.at(-1).result.source === 'local', 'clique emite seleção local')
		assert(reader.getSearchState().activeIndex === 12, 'clique atualiza seleção')
		assert(shadow.activeElement === shadow.querySelectorAll('.search-result')[12], 'clicar no trecho transfere foco à lista')
		const verticalKey = async key => {
			shadow.activeElement.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {
				key, bubbles: true, composed: true, cancelable: true
			}))
			await wait(20)
		}
		await verticalKey('ArrowDown')
		assert(reader.getSearchState().activeIndex === 13 && shadow.activeElement === shadow.querySelectorAll('.search-result')[13], 'seta abaixo move seleção e foco')
		assert(reader.getState().pagination.currentPage === reader.getSearchState().results[13].page, 'seta vertical navega à página do trecho')
		await verticalKey('ArrowUp')
		assert(reader.getSearchState().activeIndex === 12 && shadow.activeElement === shadow.querySelectorAll('.search-result')[12], 'seta acima retorna seleção e foco')
		shadow.querySelectorAll('.search-result')[23].click()
		await wait(20)
		await verticalKey('ArrowDown')
		assert(reader.getSearchState().activeIndex === 0, 'seta abaixo circula do último ao primeiro')
		await verticalKey('ArrowUp')
		assert(reader.getSearchState().activeIndex === 23, 'seta acima circula do primeiro ao último')
		shadow.querySelectorAll('.search-result')[12].click()
		await wait(20)
		shadow.querySelector('#search-view-button').click()
		await wait(20)
		assert(reader.getSearchState().view === 'compact' && reader.getSearchState().activeIndex === 12, 'alternar compacto preserva seleção')
		const external = { id: 'chapter2:0', chapterTitle: 'Capítulo 2', before: 'Antes ', match: '<img src=x onerror=alert(1)>', after: ' depois', href: '/chapter2' }
		assert(reader.setSearchResults({ requestId: state.requestId, results: [external] }), 'injeção externa aceita')
		external.match = 'alterado'
		state = reader.getSearchState()
		assert(state.results.at(-1).match.startsWith('<img'), 'argumentos são copiados')
		state.results[0].match = 'alterado'
		assert(reader.getSearchState().results[0].match !== 'alterado', 'snapshot independente')
		shadow.querySelector('#search-view-button').click()
		await wait(20)
		assert(shadow.activeElement === shadow.querySelector('#search-input'), 'abrir painel compacto devolve foco ao campo')
		await verticalKey('ArrowDown')
		assert(reader.getSearchState().activeIndex === 12, 'setas no campo não mudam seleção da lista')
		assert(!shadow.querySelector('.search-result img'), 'marcação externa permanece texto literal')
		const previousPage = reader.getState().pagination.currentPage
		shadow.querySelectorAll('.search-result')[24].click()
		await wait(20)
		assert(selections.at(-1).result.source === 'external' && reader.getState().pagination.currentPage === previousPage, 'seleção externa delega navegação')
		assert(!reader.setSearchResults({ requestId: state.requestId, results: [external, external] }), 'IDs externos duplicados são rejeitados')
		const input = shadow.querySelector('#search-input')
		input.value = 'leitura'
		input.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }))
		assert(!reader.setSearchResults({ requestId: state.requestId, results: [external] }), 'resposta anterior rejeitada durante debounce')
		await wait(250)
		assert(!reader.setSearchResults({ requestId: state.requestId, results: [external] }), 'resposta anterior rejeitada após debounce')
		state = reader.getSearchState()
		assert(state.results.length === 36, 'nova consulta recompõe resultados locais')
		reader.setSearchResults({ requestId: state.requestId, results: [external] })
		reader.setSearchResults({ requestId: state.requestId, results: [] })
		assert(reader.getSearchState().results.length === 36, 'lista vazia remove somente externos')
		shadow.querySelector('#search-clear-button').click()
		await wait(20)
		assert(!reader.setSearchResults({ requestId: state.requestId, results: [external] }) && !reader.getSearchState().results.length, 'limpar invalida resposta e lista')
		assert(shadow.activeElement === input, 'limpar devolve foco ao campo')
		reader.search('jabuticabeira')
		state = reader.getSearchState()
		shadow.querySelector('[aria-label="Fechar busca"]').click()
		await wait(20)
		assert(!reader.setSearchResults({ requestId: state.requestId, results: [external] }) && !reader.getSearchState().open, 'fechar invalida resposta')
		assert(events.at(-1).open === false && !shadow.querySelectorAll('.search-highlight').length, 'fechar emite evento e remove destaques')
		reader.search('inexistente', { view: 'panel' })
		state = reader.getSearchState()
		assert(state.results.length === 0, 'nenhum resultado local')
		reader.setSearchResults({ requestId: state.requestId, results: [external] })
		assert(reader.getSearchState().results.length === 1 && reader.getSearchState().activeIndex === -1, 'somente externos sem seleção automática')
		frame.contentDocument.querySelector('#demo-text').append(' inexistente')
		await wait(0)
		assert(!reader.setSearchResults({ requestId: state.requestId, results: [external] }), 'mutação de conteúdo invalida resposta externa')
		await wait(250)
		assert(reader.getSearchState().results.length === 1 && reader.getSearchState().results[0].source === 'local', 'mutação reindexa conteúdo')
		reader.search('lietura', { view: 'panel' })
		await wait(20)
		assert(reader.getSearchState().results.some(result => result.match === 'leitura'), 'trecho aproximado preserva grafia original')
		frame.style.width = '390px'
		await wait(350)
		assert(shadow.querySelector('#search-dropdown').getBoundingClientRect().width <= 390, 'painel cabe em viewport móvel')
		assert(shadow.querySelector('#search-result-list').scrollHeight > shadow.querySelector('#search-result-list').clientHeight, 'lista longa tem rolagem própria')
		const style = element => frame.contentWindow.getComputedStyle(element)
		const selected = shadow.querySelector('.search-result[aria-current="true"]')
		assert(style(selected).boxShadow === 'none' && style(selected).borderLeftWidth === '0px', 'seleção usa somente fundo, sem faixa esquerda')
		for (const [name, value] of Object.entries({
			'--search-panel-bg': '#123456', '--search-panel-color': '#eeeeee',
			'--search-result-active-bg': '#234567', '--search-result-divider-color': '#345678',
			'--search-result-highlight-bg': '#456789', '--search-result-highlight-color': '#ffffff'
		})) reader.style.setProperty(name, value)
		for (const mode of ['light', 'dark']) {
			shadow.querySelector('#rootComponent').classList.remove('light', 'dark')
			shadow.querySelector('#rootComponent').classList.add(mode)
			assert(style(shadow.querySelector('#search-dropdown')).backgroundColor === 'rgb(18, 52, 86)' && style(shadow.querySelector('#search-dropdown')).color === 'rgb(238, 238, 238)', `variáveis de fundo e texto herdadas no modo ${mode}`)
			assert(style(selected).backgroundColor === 'rgb(35, 69, 103)' && style(selected).boxShadow === 'none', `variável de seleção sem borda no modo ${mode}`)
			assert(style(selected.querySelector('mark')).backgroundColor === 'rgb(69, 103, 137)' && style(selected.querySelector('mark')).color === 'rgb(255, 255, 255)', `variáveis do destaque no modo ${mode}`)
			assert(style(shadow.querySelector('#search-result-list li + li')).borderTopColor === 'rgb(52, 86, 120)', `variável do separador no modo ${mode}`)
		}
		frame.style.width = '100%'
		frame.src = '/demo/search-book/index.html'
		await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
		let book = frame.contentDocument.querySelector('paginate-content')
		for (let attempt = 0; attempt < 100 && !book.search; attempt++) await wait(50)
		book.search('memória', { view: 'panel' })
		await wait(900)
		assert(book.getSearchState().results.filter(item => item.source === 'external').length === 3, 'demo integra serviço externo com latência')
		const selectedIndex = book.getSearchState().results.findIndex(item => item.id === '2:1')
		book.shadowRoot.querySelectorAll('.search-result')[selectedIndex].click()
		await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
		book = frame.contentDocument.querySelector('paginate-content')
		for (let attempt = 0; attempt < 100 && !book.search; attempt++) await wait(50)
		await wait(900)
		assert(frame.contentWindow.location.search.includes('chapter=2'), 'seleção externa abre capítulo de destino')
		assert(book.getSearchState().query === 'memória' && book.getSearchState().activeIndex === 1, 'destino retoma consulta e segunda ocorrência')
		book.search('oceano')
		await wait(900)
		assert(book.getSearchState().results.length === 2 && book.getSearchState().results.every(item => item.source === 'external'), 'demo encontra termo somente em capítulo não carregado')
		frame.contentDocument.querySelector('#external').click()
		await wait(20)
		assert(book.getSearchState().results.length === 0, 'demo permite desativar resultados externos')
		book.search('memória')
		await wait(20)
		assert(book.getSearchState().results.length === 2, 'desativar externos mantém busca local')
		document.title = `PASS ${checks.length} verificações de busca`
		output.textContent += '\nCONCLUÍDO'
	} catch (error) {
		document.title = 'FAIL busca'
		output.textContent += `\nFAIL ${error.stack}`
	}
</script>
</html>
